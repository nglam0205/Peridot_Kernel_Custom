
name: Build Peridot Kernel

on:
  workflow_dispatch:
    inputs:
      clang_url:
        description: "Direct URL to the verified Android Clang .tar.gz archive"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: peridot-kernel-build
  cancel-in-progress: false

jobs:
  build:
    name: Build kernel and publish Release
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout latest main commit
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          submodules: recursive

      - name: Update to newest commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout --detach origin/main
          echo "COMMIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "Build commit: $(git rev-parse HEAD)"
          git log -1 --format='%h %s'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache \
            flex git libelf-dev libssl-dev \
            lld llvm clang \
            python3 python3-pip \
            rsync unzip zip \
            zlib1g-dev libncurses-dev \
            device-tree-compiler \
            cpio curl xz-utils zstd

      - name: Download Clang with realtime progress
        shell: bash
        env:
          CLANG_URL: ${{ inputs.clang_url }}
        run: |
          set -euo pipefail

          ARCHIVE="$RUNNER_TEMP/clang.tar.gz"
          DEST="$RUNNER_TEMP/clang"
          mkdir -p "$DEST"

          cat > "$RUNNER_TEMP/download.py" <<'PY'
          import sys
          import time
          import urllib.request
          import os

          url, output = sys.argv[1:3]
          request = urllib.request.Request(
              url, headers={"User-Agent": "Mozilla/5.0"}
          )

          start = time.time()
          downloaded = 0
          last_size = 0
          last_time = start

          def human(n):
              units = ["B", "KB", "MB", "GB", "TB"]
              n = float(n)
              for unit in units:
                  if n < 1024 or unit == units[-1]:
                      return f"{n:.2f} {unit}"
                  n /= 1024

          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  total = int(response.headers.get("Content-Length", 0))
                  print(f"HTTP {response.status}", flush=True)
                  print(
                      f"Total: {human(total) if total else 'unknown'}",
                      flush=True
                  )

                  with open(output, "wb") as f:
                      while True:
                          chunk = response.read(256 * 1024)
                          if not chunk:
                              break
                          f.write(chunk)
                          downloaded += len(chunk)

                          now = time.time()
                          elapsed = now - last_time
                          if elapsed >= 1:
                              speed = (downloaded - last_size) / elapsed
                              pct = downloaded * 100 / total if total else 0
                              eta = (
                                  (total - downloaded) / speed
                                  if total and speed > 0 else None
                              )
                              eta_text = (
                                  f"{int(eta // 60)}m "
                                  f"{int(eta % 60)}s"
                                  if eta is not None else "unknown"
                              )
                              width = 24
                              filled = int(width * pct / 100) if total else 0
                              bar = "#" * filled + "-" * (width - filled)
                              print(
                                  f"[{bar}] {pct:6.2f}% | "
                                  f"{human(downloaded)} / "
                                  f"{human(total) if total else '?'} | "
                                  f"{speed / 1024**2:.2f} MB/s | "
                                  f"ETA {eta_text}",
                                  flush=True
                              )
                              last_time = now
                              last_size = downloaded

              print(
                  f"Downloaded {human(downloaded)} in "
                  f"{time.time() - start:.1f}s",
                  flush=True
              )
          except Exception as e:
              if os.path.exists(output):
                  os.remove(output)
              print(f"Download failed: {e}", file=sys.stderr, flush=True)
              sys.exit(1)
          PY

          python3 "$RUNNER_TEMP/download.py" "$CLANG_URL" "$ARCHIVE"

          echo "==> Extracting Clang"
          tar -xzf "$ARCHIVE" -C "$DEST"

          CLANG_BIN="$(find "$DEST" -type f -path '*/bin/clang' -print -quit)"
          if [[ -z "$CLANG_BIN" ]]; then
            echo "::error::Archive does not contain bin/clang"
            find "$DEST" -maxdepth 4 -type f | head -100
            exit 1
          fi

          CLANG_BIN_DIR="$(dirname "$CLANG_BIN")"
          echo "$CLANG_BIN_DIR" >> "$GITHUB_PATH"
          echo "CLANG_BIN_DIR=$CLANG_BIN_DIR" >> "$GITHUB_ENV"

          "$CLANG_BIN" --version
          test -x "$CLANG_BIN_DIR/ld.lld"

      - name: Configure kernel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            peridot_defconfig

      - name: Build kernel using all runner CPUs
        shell: bash
        run: |
          set -euo pipefail

          JOBS="$(nproc)"
          START="$(date +%s)"

          echo "Runner CPUs: $JOBS"
          echo "Starting build: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          make -j"$JOBS" O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            Image.gz dtbs

          END="$(date +%s)"
          echo "BUILD_SECONDS=$((END - START))" >> "$GITHUB_ENV"
          echo "Build duration: $((END - START)) seconds"

      - name: Package outputs and build information
        shell: bash
        run: |
          set -euo pipefail

          DIST="$RUNNER_TEMP/dist"
          mkdir -p "$DIST/dtbs"

          IMAGE="out/arch/arm64/boot/Image.gz"
          test -s "$IMAGE"
          cp "$IMAGE" "$DIST/Image.gz"

          find out/arch/arm64/boot/dts -type f -name '*.dtb' \
            -exec cp --parents {} "$DIST/dtbs/" \;

          tar -czf "$DIST/dtbs.tar.gz" -C "$DIST" dtbs

          {
            echo "# Peridot kernel build"
            echo
            echo "- Repository: $GITHUB_REPOSITORY"
            echo "- Commit: $COMMIT_SHA"
            echo "- Branch: main"
            echo "- Runner: $RUNNER_OS / $RUNNER_ARCH"
            echo "- CPU workers: $(nproc)"
            echo "- Clang: $(clang --version | head -1)"
            echo "- Kernel version: $(make -s O=out ARCH=arm64 kernelversion)"
            echo "- Build duration: ${BUILD_SECONDS:-unknown} seconds"
            echo "- Finished: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo
            echo "## Recent commits"
            git log -10 --pretty=format:'- %h %s (%an)' 
            echo
          } > "$DIST/BUILD_INFO.md"

          (
            cd "$DIST"
            sha256sum Image.gz dtbs.tar.gz BUILD_INFO.md > SHA256SUMS
          )

          echo "==> Output files"
          ls -lh "$DIST"
          echo "DIST=$DIST" >> "$GITHUB_ENV"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: peridot-kernel-${{ env.SHORT_SHA }}
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.SHORT_SHA }}
          target_commitish: ${{ env.COMMIT_SHA }}
          name: "Peridot Kernel Build ${{ env.SHORT_SHA }}"
          body_path: ${{ runner.temp }}/dist/BUILD_INFO.md
          files: |
            ${{ runner.temp }}/dist/Image.gz
            ${{ runner.temp }}/dist/dtbs.tar.gz
            ${{ runner.temp }}/dist/BUILD_INFO.md
            ${{ runner.temp }}/dist/SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: true

