
name: Build RealKing Kernel

on:
  workflow_dispatch:
    inputs:
      clean_build:
        description: "Clean build output"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: peridot-kernel-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout newest main commit
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          submodules: false

      - name: Record commit
        id: commit
        shell: bash
        run: |
          git fetch origin main
          git checkout --detach origin/main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "Build commit: $(git rev-parse HEAD)"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential cpio flex \
            git libelf-dev libssl-dev lld llvm clang \
            pahole python3 python-is-python3 \
            rsync unzip zip zstd lz4 device-tree-compiler

      - name: Download Android Clang
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/clang"
          curl -fL --retry 3 \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r487747c.tar.gz" \
            -o "$RUNNER_TEMP/clang.tar.gz"
          tar -xzf "$RUNNER_TEMP/clang.tar.gz" \
            -C "$RUNNER_TEMP/clang"
          echo "$RUNNER_TEMP/clang/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/clang/bin/clang" --version

      - name: Prepare KernelSU-Next
        shell: bash
        run: |
          set -euo pipefail
          rm -rf KernelSU-Next
          git clone --depth=1 \
            https://github.com/KernelSU-Next/KernelSU-Next.git \
            KernelSU-Next
          test -f KernelSU-Next/kernel/Kconfig
          test -f drivers/kernelsu/Kconfig
          git -C KernelSU-Next log -1 --oneline

      - name: Configure kernel
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.clean_build }}" == "true" ]]; then
            rm -rf out
          fi
          make O=out ARCH=arm64 LLVM=1 \
            CC="$RUNNER_TEMP/clang/bin/clang" \
            LD="$RUNNER_TEMP/clang/bin/ld.lld" \
            DTC=/usr/bin/dtc peridot_defconfig

      - name: Build kernel using all runner CPUs
        shell: bash
        run: |
          set -euo pipefail
          JOBS="$(nproc)"
          echo "Using $JOBS parallel jobs"
          make O=out ARCH=arm64 LLVM=1 \
            CC="$RUNNER_TEMP/clang/bin/clang" \
            LD="$RUNNER_TEMP/clang/bin/ld.lld" \
            DTC=/usr/bin/dtc \
            -j"$JOBS" Image.gz dtbs

          test -s out/arch/arm64/boot/Image.gz

      - name: Package build outputs
        id: package
        shell: bash
        run: |
          set -euo pipefail
          SHA="${{ steps.commit.outputs.short }}"
          PKG="RealKing-peridot-${SHA}"
          mkdir -p release "$RUNNER_TEMP/anykernel"

          cp out/arch/arm64/boot/Image.gz "release/Image-${SHA}.gz"

          cp -a anykernel/. "$RUNNER_TEMP/anykernel/"
          cp out/arch/arm64/boot/Image.gz "$RUNNER_TEMP/anykernel/Image.gz"

          (
            cd "$RUNNER_TEMP/anykernel"
            zip -r "$GITHUB_WORKSPACE/release/${PKG}.zip" .
          )

          if [[ -d out/arch/arm64/boot/dts ]]; then
            tar -czf "release/DTBs-${SHA}.tar.gz" \
              -C out/arch/arm64/boot dts
          fi

          echo "zip=release/${PKG}.zip" >> "$GITHUB_OUTPUT"
          ls -lh release/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RealKing-peridot-${{ steps.commit.outputs.short }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.commit.outputs.short }}
          name: "RealKing Kernel build ${{ steps.commit.outputs.short }}"
          target_commitish: main
          generate_release_notes: true
          files: release/*
          fail_on_unmatched_files: true
